- name: Pick a container name
  ansible.builtin.set_fact:
    ct_name: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters length=10') }}"

- name: create container
  sbstp.incus.incus_instance:
    name: "{{ ct_name }}"
    source:
      type: image
      alias: debian/12/cloud
      server: "https://images.linuxcontainers.org"
      protocol: "simplestreams"
      mode: "pull"
      allow_inconsistent: false
  register: create_result

- name: destroy container
  sbstp.incus.incus_instance:
    name: "{{ ct_name }}"
    state: absent
  register: destroy_result

- name: Pick a virtual-machine name
  ansible.builtin.set_fact:
    vm_name: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters length=10') }}"

- name: create vm
  sbstp.incus.incus_instance:
    name: "{{ vm_name }}"
    type: virtual-machine
    source:
      type: image
      alias: debian/12/cloud
      server: "https://images.linuxcontainers.org"
      protocol: "simplestreams"
      mode: "pull"
      allow_inconsistent: false
      wait_for_ipv4_addresses: true
  register: create_vm_result

- name: Get a specific instance
  sbstp.incus.incus_info:
    name: "{{ vm_name }}"
    type: instance
  register: instance
  until: instance.object.status | default('') == 'Running'
  retries: 12 # max 60 seconds
  delay: 5

- name: stop vm
  sbstp.incus.incus_instance:
    name: "{{ vm_name }}"
    state: stopped
    force_stop: true

- name: destroy vm
  sbstp.incus.incus_instance:
    name: "{{ vm_name }}"
    state: absent
  register: destroy_vm_result

- name: check create_result
  assert:
    that:
      - create_result.changed == True
      - create_result.actions == ['create', 'start']
      - not create_result.failed

- name: check destroy_result
  assert:
    that:
      - destroy_result.changed == True
      - destroy_result.actions == ['stop', 'delete']
      - not destroy_result.failed

- name: check create_vm_result
  assert:
    that:
      - create_vm_result.changed == True
      - create_vm_result.actions == ['create', 'start']
      - not create_vm_result.failed

- name: debug result
  ansible.builtin.debug:
    var: destroy_vm_result

- name: check destroy_vm_result
  assert:
    that:
      - destroy_vm_result.changed == True
      - destroy_vm_result.actions == ['delete']
      - not destroy_vm_result.failed

name: Ansible Collection Checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  # schedule:
  #   - cron: "0 4 * * 4"

permissions:
  contents: read

# please track https://github.com/ansible-collections/news-for-maintainers/issues/28

jobs:
  "ruff-lint":
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ruff check (linting)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

  "ruff-format":
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  "sanity-and-unit-testing":
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: sbstp.incus

      # https://github.com/ansible/ansible/issues/72634
      - name: Checkout community.general dependency
        uses: actions/checkout@v4
        with:
          repository: ansible-collections/community.general
          path: ansible_collections/community/general

      - name: create a fake incus cli for use in later testing
        run: |
          echo '#!/bin/bash' > /usr/local/bin/incus
          echo 'echo "incus is currently a fake"' >> /usr/local/bin/incus
          echo 'exit 1' >> /usr/local/bin/incus
          chmod +x /usr/local/bin/incus

      - name: Perform sanity testing with ansible-test
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: stable-2.20
          testing-type: sanity
          collection-src-directory: sbstp.incus

      - name: Perform unit testing with ansible-test
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: stable-2.20
          testing-type: units
          collection-src-directory: sbstp.incus

  "integration-testing":
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/sbstp/incus

      - name: Install Incus (Zabbly Repository)
        run: |
          sudo curl -fsSL https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc
          sudo sh -c 'cat <<EOF > /etc/apt/sources.list.d/zabbly-incus-stable.sources
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: $(. /etc/os-release && echo ${VERSION_CODENAME})
          Components: main
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/zabbly.asc
          EOF'
          sudo apt-get update
          sudo apt-get install -y incus

      - name: Reset Firewall Rules
        run: |
          sudo nft flush ruleset

      - name: Initialize Incus
        run: |
          sudo adduser runner incus-admin
          sudo -u runner incus admin init --minimal

      # SSH setup — required for ssh_incus connection plugin tests
      # The connection plugin SSHes into localhost to reach Incus.
      - name: Install and start OpenSSH server
        run: |
          sudo apt-get install -y openssh-server openssh-client
          sudo systemctl enable ssh
          sudo systemctl start ssh
          sudo ufw disable 2>/dev/null || true

      - name: Create SSH directory for runner user
        run: |
          sudo -u runner mkdir -p /home/runner/.ssh
          sudo -u runner chmod 700 /home/runner/.ssh
          ssh-keyscan -t ed25519 localhost 2>/dev/null | sudo -u runner tee /home/runner/.ssh/known_hosts
          # Ensure runner can SSH to themselves passwordlessly for the test
          sudo -u runner ssh-keygen -t ed25519 -f /home/runner/.ssh/id_ansible_test -N '' -q
          sudo -u runner sh -c 'cat /home/runner/.ssh/id_ansible_test.pub >> /home/runner/.ssh/authorized_keys'
          chmod 600 /home/runner/.ssh/authorized_keys

      - run: |
          python3 -m pip install ansible
          which ansible-test

      # `sudo -u runner` is necessary to execute with the new group membership
      - run: sudo -E -u runner /home/runner/.local/bin/ansible-test integration --allow-unsupported -vvv
        working-directory: ansible_collections/sbstp/incus
